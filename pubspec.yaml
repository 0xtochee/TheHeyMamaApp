name: pregnancy_dashboard
description: A comprehensive pregnancy monitoring dashboard with vital tracking and alerts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2

  # UI & Charts
  fl_chart: ^0.66.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/blood_pressure.png
    - assets/images/heart_rate.png
    - assets/images/alert.png
    - assets/images/nutrition.png
    - assets/images/nutrition_tip.png
    - assets/images/sign-in-logo.png
    - assets/images/my_preg_img.png
    - assets/images/tip_for_img.png
    - assets/images/map.png
    - assets/images/clinic_1.png
    - assets/images/clinic_2.png
    - assets/images/clinic_3.png
    - assets/images/clinic_inside_1.png
    - assets/images/clinic_inside_2.png
    - assets/images/clinic_inside_3.png
    - assets/images/doctor_placeholder.png
    - assets/images/female_avatar1.png
    - assets/images/female_avatar2.png
    - assets/images/female_doctor.png
